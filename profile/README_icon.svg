        <feFuncG type="linear" slope="1.6" intercept="-0.3"/>
        <feFuncB type="linear" slope="1.6" intercept="-0.3"/>
        <feFuncA type="table" tableValues="1 1"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="tooth" mode="overlay" result="printed"/>
      <feComposite in="printed" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <g filter="url(#grain)">
