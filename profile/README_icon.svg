<svg xmlns="http://www.w3.org/2000/svg" viewBox="36 80 386 174" width="386" height="174" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Anvil</title>
  <defs>
    <clipPath id="anvil">
      <polygon points="40,112 170,84 418,84 418,116 392,116 380,132 334,138 316,160 316,184 336,206 376,212 384,214 384,250 104,250 104,214 112,212 154,206 176,184 176,160 160,140 120,130"/>
    </clipPath>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="1.8" numOctaves="3" seed="7" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="tooth">
