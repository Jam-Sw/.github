<svg xmlns="http://www.w3.org/2000/svg" width="101" height="20" viewBox="0 0 101 20" role="img" aria-label="v0.10.0 beta">
<title>v0.10.0 beta</title>
<defs>
<clipPath id="badge"><rect width="101" height="20" rx="4"/></clipPath>
<filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="2.178" numOctaves="2" seed="3" stitchTiles="stitch" result="noise"/>
  <feColorMatrix in="noise" type="matrix" result="gray"
    values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 1 0"/>
  <feComponentTransfer in="gray" result="stipple">
    <feFuncR type="linear" slope="1.45" intercept="-0.22"/>
    <feFuncG type="linear" slope="1.45" intercept="-0.22"/>
    <feFuncB type="linear" slope="1.45" intercept="-0.22"/>
  </feComponentTransfer>
  <feBlend in="SourceGraphic" in2="stipple" mode="overlay" result="printed"/>
  <feComposite in="printed" in2="SourceGraphic" operator="in"/>
</filter>
</defs>
<g clip-path="url(#badge)" filter="url(#grain)"><rect x="0" width="57" height="20" fill="#5A6570"/><polygon points="22.8,20 57,0 57,20" fill="#12171C"/><rect x="57" width="44" height="20" fill="#9C5617"/><polygon points="74.6,20 101,0 101,20" fill="#2E1600"/></g>
<text x="28.5" y="14" text-anchor="middle" textLength="43.4" lengthAdjust="spacingAndGlyphs" fill="#F3F0E6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700">v0.10.0</text><text x="79" y="14" text-anchor="middle" textLength="29.6" lengthAdjust="spacingAndGlyphs" fill="#F3F0E6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700">BETA</text>
</svg>
