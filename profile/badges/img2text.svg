<svg xmlns="http://www.w3.org/2000/svg" width="109" height="20" viewBox="0 0 109 20" role="img" aria-label="v0.1.0 stable">
<title>v0.1.0 stable</title>
<defs>
<clipPath id="badge"><rect width="109" height="20" rx="4"/></clipPath>
<filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="2.018" numOctaves="2" seed="3" stitchTiles="stitch" result="noise"/>
  <feColorMatrix in="noise" type="matrix" result="gray"
    values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 1 0"/>
  <feComponentTransfer in="gray" result="stipple">
    <feFuncR type="linear" slope="1.45" intercept="-0.22"/>
    <feFuncG type="linear" slope="1.45" intercept="-0.22"/>
    <feFuncB type="linear" slope="1.45" intercept="-0.22"/>
  </feComponentTransfer>
  <feBlend in="SourceGraphic" in2="stipple" mode="overlay" result="printed"/>
  <feComposite in="printed" in2="SourceGraphic" operator="in"/>
</filter>
</defs>
<g clip-path="url(#badge)" filter="url(#grain)"><rect x="0" width="51" height="20" fill="#5A6570"/><polygon points="20.400000000000002,20 51,0 51,20" fill="#12171C"/><rect x="51" width="58" height="20" fill="#1664D0"/><polygon points="74.2,20 109,0 109,20" fill="#081A40"/><polygon points="51,0 58,0 51,6" fill="#F5C400"/></g>
<text x="25.5" y="14" text-anchor="middle" textLength="37.2" lengthAdjust="spacingAndGlyphs" fill="#F3F0E6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700">v0.1.0</text><text x="80" y="14" text-anchor="middle" textLength="44.400000000000006" lengthAdjust="spacingAndGlyphs" fill="#F3F0E6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700">STABLE</text>
</svg>
