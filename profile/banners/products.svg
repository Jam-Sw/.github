<svg xmlns="http://www.w3.org/2000/svg" width="880" height="24" viewBox="0 0 880 24" role="img" aria-label="Products">
<title>Products</title>
<defs>
<!-- side view: head is the bar of a T lying on its side, its outer face toward the label -->
<clipPath id="head"><polygon points="101,4.5 106.5,4.5 107.5,5.5 107.5,18.5 106.5,19.5 101,19.5 100,18.5 100,5.5"/></clipPath>
<!-- handle ~4 px at the eye, swelling to ~5 px at the grip, ending in a small knob -->
<clipPath id="handle"><polygon points="107.5,10 872,9.5 872,14.5 107.5,14"/><rect x="868" y="9" width="12" height="6" rx="2.5"/></clipPath>
<filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.250" numOctaves="2" seed="3" stitchTiles="stitch" result="noise"/>
  <feColorMatrix in="noise" type="matrix" result="gray"
    values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 1 0"/>
  <feComponentTransfer in="gray" result="stipple">
    <feFuncR type="linear" slope="1.45" intercept="-0.22"/>
    <feFuncG type="linear" slope="1.45" intercept="-0.22"/>
    <feFuncB type="linear" slope="1.45" intercept="-0.22"/>
  </feComponentTransfer>
  <feBlend in="SourceGraphic" in2="stipple" mode="overlay" result="printed"/>
  <feComposite in="printed" in2="SourceGraphic" operator="in"/>
</filter>
</defs>
<text x="0" y="17" textLength="86" lengthAdjust="spacingAndGlyphs" fill="#ffffff" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" paint-order="stroke" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800">PRODUCTS</text>
<g filter="url(#grain)">
  <!-- handle: Kiln Amber, 2 tones -->
  <g clip-path="url(#handle)">
    <rect x="106" y="8" width="774" height="8" fill="#9C5617"/>
    <polygon points="106,12.2 880,12.4 880,16 106,16" fill="#2E1600"/>
  </g>
  <!-- head: Anvil Slate steel, 3 tones -->
  <g clip-path="url(#head)">
    <rect x="99" y="4" width="10" height="16" fill="#8B96A1"/>
    <polygon points="103,20 108,11 108,20" fill="#343E48"/>
    <polygon points="100,4 104.5,4 100,10" fill="#F3F0E6"/>
  </g>
</g>
</svg>
