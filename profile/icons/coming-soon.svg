<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Coming soon icon" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Coming soon</title>
  <defs>
    <clipPath id="plate"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <clipPath id="glass"><polygon points="336,274 688,274 524,512 688,750 336,750 500,512"/></clipPath>
    <clipPath id="caps"><rect x="292" y="214" width="440" height="60" rx="16"/><rect x="292" y="750" width="440" height="60" rx="16"/></clipPath>
    <clipPath id="sand"><polygon points="404,330 620,330 512,478"/><polygon points="512,636 648,750 376,750"/></clipPath>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.36" numOctaves="2" seed="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix" result="gray"
        values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 1 0"/>
      <feComponentTransfer in="gray" result="stipple">
        <feFuncR type="linear" slope="1.45" intercept="-0.22"/>
        <feFuncG type="linear" slope="1.45" intercept="-0.22"/>
        <feFuncB type="linear" slope="1.45" intercept="-0.22"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="stipple" mode="overlay" result="printed"/>
      <feComposite in="printed" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <g clip-path="url(#plate)" filter="url(#grain)">
    <!-- plate: deep slate (L* 20) so every object reads against it -->
    <rect x="100" y="100" width="824" height="824" fill="#2A323A"/>

    <!-- glass: primary object, 3 tones -->
    <g clip-path="url(#glass)">
      <rect x="330" y="270" width="364" height="484" fill="#6F7A85"/>
      <polygon points="512,512 700,270 700,760 596,760" fill="#343E48"/>
      <polygon points="336,274 420,274 374,340" fill="#B8C2CB"/>
      <!-- rim facet: keeps the shadowed right edge legible against the plate -->
      <polygon points="668,274 700,274 536,512 700,750 668,750 504,512" fill="#6F7A85"/>
    </g>

    <!-- sand: paper, with lower-right shadow facets -->
    <g clip-path="url(#sand)">
      <rect x="370" y="326" width="284" height="428" fill="#F3F0E6"/>
      <polygon points="512,478 640,330 640,478" fill="#8B96A1"/>
      <polygon points="512,636 660,750 548,750" fill="#8B96A1"/>
    </g>

    <!-- falling sand: motion, dashed paper stroke -->
    <path d="M 512 484 L 512 632" fill="none" stroke="#F3F0E6" stroke-width="6" stroke-linecap="butt" stroke-dasharray="13 16"/>

    <!-- caps: minor objects, 2 tones -->
    <g clip-path="url(#caps)">
      <rect x="292" y="214" width="440" height="596" fill="#D3DBE2"/>
      <polygon points="560,274 736,208 736,274" fill="#4E5963"/>
      <polygon points="560,810 736,744 736,810" fill="#4E5963"/>
    </g>
  </g>
</svg>
