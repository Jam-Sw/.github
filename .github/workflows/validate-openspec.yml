name: Validate OpenSpec format

on:
  workflow_call:
    inputs:
      needs-info-label:
        description: Label applied when required sections are missing
        type: string
        default: needs-info

permissions:
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    # Opened and labeled events can fire together for issue forms; serialize runs.
    concurrency:
      group: openspec-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check body for required sections
        uses: actions/github-script@v7
        env:
          NEEDS_INFO_LABEL: ${{ inputs.needs-info-label }}
        with:
          script: |
            const label = process.env.NEEDS_INFO_LABEL;
            const isPR = !!context.payload.pull_request;
            const target = isPR ? context.payload.pull_request : context.payload.issue;
            if (!target) {
              core.info('No issue or pull request in payload; nothing to validate.');
              return;
            }

            const labels = (target.labels || []).map(l => typeof l === 'string' ? l : l.name);
            const title = (target.title || '').trim();
            const branch = isPR ? ((context.payload.pull_request.head || {}).ref || '') : '';
            const issue_number = target.number;
            const { owner, repo } = context.repo;

            const clearLabel = async () => {
              if (labels.includes(label)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label })
                  .catch(e => core.warning(`Could not remove label: ${e.message}`));
              }
            };

            // CONTRIBUTING §5.4: bot-authored targets are exempt.
            if (target.user && target.user.type === 'Bot') {
              core.info(`Opened by bot ${target.user.login}; skipping validation.`);
              return;
            }

            // CONTRIBUTING §5.3: feature-request issues use their own form.
            const isFeatureRequest = !isPR && (labels.includes('enhancement') ||
              labels.includes('feature') ||
              /^\[feature/i.test(title));
            if (isFeatureRequest) {
              core.info('Target is a feature request; skipping validation.');
              await clearLabel();
              return;
            }

            const body = (target.body || '').replace(/<!--[\s\S]*?-->/g, '');
            const heading = names => new RegExp(`^#{1,3}\\s*(${names})\\b`, 'im');

            // CONTRIBUTING §5.2: feature PR classification.
            const isFeaturePR = isPR && (
              /^feat(\([^)]*\))?!?:/i.test(title) ||
              /^feat\//i.test(branch) ||
              labels.includes('feature') ||
              labels.includes('enhancement')
            );

            // Every PR and non-feature issue has baseline sections.
            const required = [
              { name: '§1.1 Summary', pattern: heading('Summary|Why') },
              { name: '§1.2 Changes', pattern: heading('Changes|What Changes') },
            ];
            if (isPR) {
              required.push({ name: '§1.3 Verification', pattern: heading('Verification') });
            }

            // Feature PRs and issues carrying `openspec` need the spec details.
            if (isFeaturePR || labels.includes('openspec')) {
              required.push(
                { name: '§2.1 ADDED / MODIFIED / REMOVED Requirements', pattern: heading('(ADDED|MODIFIED|REMOVED) Requirements') },
                { name: '§2.1 RFC 2119 keyword (SHALL/MUST)', pattern: /\b(SHALL|MUST)\b/ },
                { name: '§2.2 GIVEN/WHEN/THEN scenario', pattern: /GIVEN[\s\S]*WHEN[\s\S]*THEN/ },
                { name: '§1.3 Numbered Verification checklist', pattern: /^#{1,3}\s*Verification\b[\s\S]*?\b\d+\.\d+\b/im },
              );
            }

            const missing = [...new Set(required.filter(r => !r.pattern.test(body)).map(r => r.name))];

            if (missing.length === 0) {
              await clearLabel();
              core.info('All required sections present.');
              return;
            }

            const comment = [
              `### OpenSpec format check failed`,
              ``,
              `This ${isFeaturePR ? 'feature ' : ''}${isPR ? 'pull request' : 'issue'} body is missing required sections:`,
              ``,
              ...missing.map(m => `- [ ] **${m}**`),
              ``,
              `Please edit the body to include them. The workflow validates sections but does not apply the \`openspec\` label; maintainers apply labels required by the contributing guide. See the [contributing guide](https://github.com/Jam-Sw/.github/blob/main/CONTRIBUTING.md) for the format.`,
            ].join('\n');

            // Forked-PR tokens are read-only; fall back to failing the check.
            try {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [label] });
              const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
              const existing = comments.find(c =>
                c.user.type === 'Bot' && c.body.includes('OpenSpec format check failed'));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: comment });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body: comment });
              }
            } catch (e) {
              core.warning(`Could not label/comment (read-only token?): ${e.message}`);
            }

            core.setFailed(`Missing sections: ${missing.join(', ')}`);
